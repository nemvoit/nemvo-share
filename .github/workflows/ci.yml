name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find nemvo-share -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  build:
    name: Build zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: for f in nemvo-share/assets/js/*.js nemvo-share/blocks/share/*.js; do node --check "$f"; done
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nemvo-share-zip
          path: dist/*.zip

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./nemvo-share
          slug: nemvo-share
